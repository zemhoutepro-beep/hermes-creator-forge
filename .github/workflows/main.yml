name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate skill packages
        run: python scripts/validate_skills.py --root .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build source review archive
        run: python scripts/build_source_archive.py --output "$RUNNER_TEMP/hermes-creator-forge.zip"
